<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>mova.ia – lot de vidéos</title>
<style>
@font-face{font-family:"Inter";font-weight:400;src:url("fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url("fonts/inter-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url("fonts/inter-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Jakarta";font-weight:600;src:url("fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Jakarta";font-weight:700;src:url("fonts/plus-jakarta-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Jakarta";font-weight:800;src:url("fonts/plus-jakarta-sans-latin-800-normal.woff2") format("woff2")}
:root{--bg:#000611;--green:#00B87F;--mint:#2EE6A6;--red:#FF4D4F;--amber:#FFC266;--text:#E9EFF6;--muted:#8FA3BC;--glass:rgba(10,30,56,.62);--line:rgba(130,175,220,.20)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
body{font-family:"Inter",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(1400px 1000px at 50% 18%,#0a2246 0%,#020b1a 55%,#000611 100%)}
.abs{position:absolute}
.layer{position:absolute;left:0;top:0;width:1080px;height:1920px}
#grid{background-image:linear-gradient(rgba(120,170,230,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,230,.06) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(900px 900px at 50% 45%,#000 20%,transparent 75%)}
.glow{position:absolute;border-radius:50%;pointer-events:none}
#glowG{width:1400px;height:1100px;left:-160px;top:420px;background:radial-gradient(closest-side,rgba(0,184,127,.30),transparent)}
#glowR{width:1500px;height:1200px;left:-210px;top:380px;background:radial-gradient(closest-side,rgba(255,40,50,.42),transparent);opacity:0}
#aurora{width:1700px;height:900px;left:-310px;top:760px;background:radial-gradient(closest-side,rgba(0,184,127,.45),rgba(0,120,90,.15) 55%,transparent);opacity:0}
#bgDash{position:absolute;left:-70px;top:430px;width:1220px;height:1180px;border-radius:44px;background:linear-gradient(180deg,#0b2c3c,#06182a);border:2px solid rgba(46,230,166,.28);box-shadow:0 0 160px rgba(0,184,127,.28);transform-origin:50% 40%;--acc:#2EE6A6;overflow:hidden}
#bgDash.red{--acc:#FF5A5F;border-color:rgba(255,77,79,.45);box-shadow:0 0 160px rgba(255,40,50,.3)}
#bgTint{position:absolute;inset:0;background:#ff2a35;mix-blend-mode:color;opacity:0;pointer-events:none}
.dh{position:absolute;left:0;top:0;width:100%;height:96px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 34px;font-family:"Jakarta";font-weight:700;font-size:32px}
.dh i{display:block;width:34px;height:34px;border-radius:9px;background:var(--acc)}
.dh .wk{margin-left:auto;font-family:"Inter";font-weight:500;font-size:22px;color:var(--muted);border:1px solid var(--line);padding:8px 18px;border-radius:999px}
.kpis{position:absolute;left:40px;top:130px;width:1140px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:18px;padding:22px}
.kpi b{display:block;font-family:"Jakarta";font-weight:800;font-size:60px;margin-top:6px;color:var(--acc)}
.kpi span{font-size:21px;color:var(--muted)}
.chart{position:absolute;left:40px;top:330px;width:1140px;height:250px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.025)}
.tbl{position:absolute;left:40px;top:610px;width:1140px;font-size:26px}
.tr{display:grid;grid-template-columns:1.1fr 1.2fr 1.7fr;align-items:center;padding:20px 18px;border-bottom:1px solid var(--line)}
.st{justify-self:start;padding:8px 16px;border-radius:999px;font-size:21px;font-weight:600;background:rgba(255,255,255,.07);color:var(--text)}
.st.ok{background:rgba(46,230,166,.18);color:#2EE6A6}
.st.bad{background:rgba(255,77,79,.2);color:#FF8A8C}
#vignette{background:radial-gradient(1200px 1500px at 50% 45%,transparent 55%,rgba(0,0,0,.75) 100%);z-index:40;pointer-events:none}
#redvig{background:radial-gradient(1100px 1400px at 50% 45%,transparent 45%,rgba(200,0,20,.45) 100%);z-index:41;opacity:0}
#flash{background:#fff;z-index:60;opacity:0}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0;visibility:hidden}
#kt{position:absolute;left:70px;width:940px;text-align:center;font-weight:600;font-size:44px;line-height:1.28;letter-spacing:-.5px;z-index:50;text-shadow:0 2px 18px rgba(0,0,0,.85)}
#kt span{display:inline-block;margin:0 1px;opacity:0}
#kt span.g{color:var(--mint)}
#kt span.r{color:#FF6B6E}
#tag{position:absolute;right:60px;top:228px;padding:8px 20px;border-radius:999px;border:2px dashed rgba(143,163,188,.55);color:var(--muted);font-size:24px;font-weight:600;z-index:55;opacity:0}

/* cartes en verre */
.glass{position:absolute;border-radius:30px;background:rgba(9,26,48,.88);border:1.5px solid rgba(160,210,235,.28);box-shadow:0 40px 110px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(12px);opacity:0}
.gh{position:absolute;left:34px;top:30px;display:flex;align-items:center;gap:16px;font-size:25px;color:var(--muted);white-space:nowrap}
.mini{width:48px;height:48px;border-radius:12px;background:#0B3A2E;display:flex;align-items:center;justify-content:center;color:#2EE6A6;font-weight:800;font-size:26px;flex:none}
.clk{position:absolute;right:30px;top:24px;padding:10px 20px;border-radius:14px;background:rgba(255,255,255,.07);border:1.5px solid var(--line);font-family:"Jakarta";font-weight:800;font-size:34px;color:#F2F6FA;white-space:nowrap}
.mtx{position:absolute;left:34px;top:112px;width:870px;font-size:36px;line-height:1.32}
.pill{position:absolute;padding:12px 24px;border-radius:999px;font-size:28px;font-weight:600;white-space:nowrap;border:1.5px solid transparent}
.pill.n{background:rgba(255,255,255,.08);color:#C9D6E3}
.pill.a{background:rgba(255,190,70,.14);color:var(--amber);border-color:rgba(255,190,70,.55)}
.pill.r{background:rgba(255,77,79,.2);color:#FFB3B4;border-color:rgba(255,77,79,.8)}
.pill.g{background:rgba(46,230,166,.16);color:var(--mint);border-color:rgba(46,230,166,.6)}
.alert{position:absolute;display:flex;align-items:center;gap:16px;padding:16px 28px 16px 18px;border-radius:999px;background:rgba(58,6,12,.85);border:2px solid rgba(255,77,79,.8);color:#FFC2C3;font-size:30px;font-weight:500;white-space:nowrap;box-shadow:0 0 36px rgba(255,50,60,.45);z-index:20;opacity:0}
.alert i,.li i.x{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:24px;flex:none}
.row{position:absolute;left:70px;width:940px;height:84px;border-radius:20px;background:rgba(9,26,48,.86);border:1.5px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 26px;font-size:28px;white-space:nowrap;opacity:0}
.row i{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-weight:800;font-size:22px;flex:none}
.row em{font-style:normal;margin-left:auto;font-size:24px}

/* carte de l'agent */
.ring{position:absolute;left:34px;top:30px;width:80px;height:80px}
.at{position:absolute;left:134px;top:34px;font-family:"Jakarta";font-weight:800;font-size:33px;letter-spacing:-.5px;white-space:nowrap}
.as{position:absolute;left:134px;top:82px;font-size:23px;color:var(--muted)}
.ck{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--green);color:#03231A;font-weight:900;font-size:21px;flex:none}
.task{position:absolute;left:44px;display:flex;align-items:center;gap:18px;font-size:30px;white-space:nowrap;opacity:0}
.task .s{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,190,70,.9);border-right-color:transparent;flex:none}
.task .d{display:none}
.caret{display:inline-block;width:3px;height:38px;background:var(--mint);vertical-align:-6px;margin-left:2px}
.vbtn{position:absolute;left:250px;width:580px;height:104px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:14px;font-family:"Jakarta";font-weight:800;font-size:36px;background:rgba(10,30,56,.8);border:2px solid rgba(46,230,166,.6);box-shadow:0 0 50px rgba(0,184,127,.25);opacity:0;white-space:nowrap}

/* liste inclinée */
.tiltWrap{position:absolute;left:0;width:1080px;height:760px;perspective:1500px;opacity:0}
.tilt{position:absolute;left:60px;top:40px;width:960px;height:560px;border-radius:30px;border:1.5px solid rgba(255,77,79,.35);transform-origin:40% 50%;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.tilt.r{background:linear-gradient(120deg,rgba(40,10,16,.94),rgba(14,6,12,.92) 55%)}
.tilt.g{background:linear-gradient(120deg,rgba(6,40,36,.94),rgba(4,18,30,.92) 55%);border-color:rgba(46,230,166,.35)}
.tilt.w{background:linear-gradient(120deg,rgba(14,32,56,.94),rgba(6,16,30,.92) 55%);border-color:rgba(160,210,235,.35)}
.tilt h4{position:absolute;left:46px;top:34px;font-size:26px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.li{position:absolute;left:46px;display:flex;align-items:center;gap:20px;font-size:40px;font-style:italic;font-weight:500;white-space:nowrap;opacity:0}
.li.r{color:#FF7A7D}
.li.g{color:#BFF5E1}
.li.w{color:#F2F6FA;font-style:normal;font-weight:600}
.li svg{width:38px;height:38px;flex:none}

/* avant / avec */
.cmp{position:absolute;left:70px;width:940px;height:262px;border-radius:30px;background:rgba(9,28,48,.9);border:1.5px solid rgba(160,220,200,.28);box-shadow:0 40px 110px rgba(0,0,0,.6);opacity:0}
.cmp .hd{position:absolute;left:36px;top:28px;font-size:25px;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
.cmp .rw{position:absolute;left:36px;display:flex;align-items:center;gap:18px;font-size:34px;white-space:nowrap}
.cmp .lab{width:200px;font-size:20px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.cmp .bad{top:92px;color:#FF8A8C}
.cmp .bad .lab{color:#FF6B6E}
.cmp .good{top:172px;color:#E9EFF6;font-weight:600;opacity:0}
.cmp .good .lab{color:var(--mint)}
.cmp .txt{position:relative}
.cmp .strike{position:absolute;left:-4px;top:52%;height:4px;width:0;background:#FF6B6E;border-radius:2px}

/* logo, statistique, appel à l'action */
.logo{position:absolute;left:0;width:1080px;display:flex;justify-content:center;align-items:center;gap:30px;z-index:30}
.logo svg{overflow:visible}
.wm{font-family:"Jakarta";font-weight:800;letter-spacing:-3px;white-space:nowrap;color:#F2F6FA}
.tagl{position:absolute;left:0;width:1080px;text-align:center;font-size:35px;color:#B9C8D8;letter-spacing:1px;z-index:30}
.seed{position:absolute;width:44px;height:44px;border-radius:10px;background:#fff;left:518px;z-index:31;opacity:0}
.stat{position:absolute;left:90px;top:640px;width:900px;height:440px;border-radius:34px;background:rgba(40,4,10,.78);border:2px solid rgba(255,77,79,.55);box-shadow:0 0 90px rgba(255,40,50,.35);opacity:0;z-index:25}
.stat .n{position:absolute;left:50px;top:40px;font-family:"Jakarta";font-weight:800;font-size:220px;letter-spacing:-7px;line-height:1;white-space:nowrap}
.stat .la,.stat .lb{position:absolute;left:54px;top:290px;width:800px;font-size:42px;font-weight:600;line-height:1.2}
.btn{position:absolute;padding:30px 54px;border-radius:999px;background:var(--green);color:#03231A;font-family:"Jakarta";font-weight:800;font-size:42px;white-space:nowrap;z-index:30;opacity:0}
.ctaTx{position:absolute;left:0;width:1080px;text-align:center;opacity:0}
#cursor{position:absolute;left:0;top:0;width:56px;height:56px;z-index:70;opacity:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
#ripple{position:absolute;width:90px;height:90px;border-radius:50%;border:4px solid rgba(46,230,166,.95);z-index:69;opacity:0}
</style>
</head>

<script>
const TL = /*TL*/;
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const inout = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = clamp(x); const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, p) => a + (b - a) * p;
const S = TL.segs;
const NB = ' ';

function ap(el, t, t0, d = .45, o = {}) {
  const p = ease((t - t0) / d);
  const y = o.y ?? 30, x = o.x ?? 0, s = o.s ?? .96, bl = o.blur ?? 0;
  el.style.opacity = p * (o.op ?? 1);
  el.style.transform = `translate(${(1 - p) * x + (o.dx ?? 0)}px,${(1 - p) * y + (o.dy ?? 0)}px) scale(${(s + (1 - s) * p) * (o.k ?? 1)})`;
  if (bl) el.style.filter = `blur(${(1 - p) * bl + (o.bl0 ?? 0)}px)`;
  return p;
}
const out = (el, t, t0, d = .3) => { const q = clamp((t - t0) / d); el.style.opacity = parseFloat(el.style.opacity || 0) * (1 - q); return q; };
function pop(el, t, t0, d = .5) {
  const p = clamp((t - t0) / d);
  el.style.opacity = clamp(p * 3);
  el.style.transform = `scale(${.5 + .5 * back(p)})`;
  return p;
}
const norm = s => s.toLowerCase().replace(/[.,:?!«»¶]/g, '').replace(/ /g, ' ');
function wt(seg, key, nth = 0) {
  let k = 0;
  for (const w of TL.words) {
    if (w.seg !== seg) continue;
    if (norm(w.w).includes(key)) { if (k === nth) return w.t0; k++; }
  }
  return S[seg].start;
}
function el(tag, cls, html, style, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html) e.innerHTML = html;
  if (style) e.style.cssText = style;
  (parent || $('scenes')).appendChild(e);
  return e;
}
function mkScene(id) { const d = el('div', 'scene'); d.id = id; return d; }
function typeText(e, text, t, t0, cps, caret, hl) {
  const n = Math.max(0, Math.min(text.length, Math.floor((t - t0) * cps)));
  let s = text.slice(0, n);
  if (hl) s = s.replace(hl, `<span style="color:#2EE6A6">${hl}</span>`);
  e.innerHTML = s + (caret && (n < text.length || Math.floor(t * 2) % 2) && t > t0 - .3 ? '<span class="caret"></span>' : '');
  return n >= text.length;
}

    B: { k: [['Acquéreurs', '214'], ['Non relancés', '96'], ['Fiches à jour', '31'], ['Doublons', '27']], r: [['M. Durand', 'Maison + jardin', 'Relance : il y a 5 mois', 'bad'], ['Mme Martin', 'T3 · Centre', 'Projet changé ?', 'bad'], ['M. Leroy', 'Maison 5 p.', 'A acheté ailleurs', 'bad'], ['Mme Petit', 'T2 · Gare', 'Relance : il y a 7 mois', 'bad'], ['M. Bernard', 'T4 · Parc', 'Fiche en double', 'bad']] },

};
let dashKey = '';
function setDash(view, mode) {
  const key = view + mode;
  if (key === dashKey) return;
  dashKey = key;
  const V = VIEWS[view], M = V[mode];
  $('bgTitle').textContent = V.title;
  $('bgWk').textContent = mode === 'C' ? 'avec mova.ia' : 'Semaine 42';
  $('bgKpis').innerHTML = M.k.map(([l, v]) => `<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('');
  $('bgTbl').innerHTML = M.r.map(([a, b, c, d]) => `<div class="tr"><span>${a}</span><span>${b}</span><span class="st ${d}">${c}</span></div>`).join('');
  $('bgLine').setAttribute('points', mode === 'B' ? DOWN : UP);
  $('bgDash').classList.toggle('red', mode === 'B');
  $('bgTint').style.opacity = mode === 'B' ? .45 : 0;
}
// o : {op, view, mode, pose ('in' | 'L' | 'R'), t0, blur, bright, shake}
function dash(t, o) {
  const bw = $('bgWrap'), bd = $('bgDash');
  if (!o || o.op <= 0) { bw.style.opacity = 0; return 0; }
  bw.style.opacity = o.op;
  setDash(o.view, o.mode);
  const q = clamp((t - o.t0) / 8);
  let rx, ry, rz, sc, ty = 0;
  if (o.pose === 'in') {
    const p = inout((t - o.t0) / 3.5), q2 = clamp((t - o.t0 - 3.5) / 10);
    rx = lerp(lerp(30, 16, p), 11, q2); ry = lerp(lerp(-20, -8, p), 4, q2); rz = lerp(5, 2, p); sc = lerp(lerp(.86, 1, p), 1.1, q2);
  } else if (o.pose === 'R') {
    rx = lerp(20, 14, q); ry = lerp(18, 10, q); rz = lerp(5, 3, q); ty = -q * 60; sc = lerp(1.05, 1.12, q);
  } else {
    rx = lerp(26, 18, q); ry = lerp(-16, -8, q); rz = lerp(-6, -3, q); ty = -q * 80; sc = lerp(1, 1.1, q);
  }
  let shx = 0, shy = 0;
  if (o.shake != null && t > o.shake && t < o.shake + .45) { const a = (1 - (t - o.shake) / .45) * 14; shx = Math.sin(t * 90) * a; shy = Math.cos(t * 77) * a; }
  bd.style.transform = `translate(${shx}px,${shy + ty}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`;
  bd.style.filter = `blur(${o.blur ?? 0}px) brightness(${o.bright ?? 1})`;
  return o.op;
}
function shakeAt(t, t0, amp = 10) {
  if (t < t0 || t > t0 + .45) return [0, 0];
  const a = (1 - (t - t0) / .45) * amp;
  return [Math.sin(t * 90) * a, Math.cos(t * 77) * a];
}

function animAgent(t, c, tin) {

    if (tx.textContent !== txt) tx.textContent = txt;
    tx.style.color = done ? '#E9EFF6' : tk.wait ? '#FFC266' : '#8FA3BC';
  });
  const sp = c.querySelector('.spin');
  sp.setAttribute('stroke', all ? '#00B87F' : '#FFBE46');

function mkTilt(parent, items, kind, top, title, flip) {

function mkLogo(parent, top, icon = 150, font = 122) {

function animStat(t, e, tin, tout, t68) {

// ——— texte cinétique ———
const ORDER = Object.keys(S);
const WSEG = {}; TL.words.forEach(w => (WSEG[w.seg] = WSEG[w.seg] || []).push(w));
const kt = $('kt');
function kinetic(t) {
  let seg = null;
  for (const id of ORDER) { const s = S[id]; if (t >= s.start - .05 && t < s.end + .5) seg = id; }
  const cfg = (seg && VIDEO.kt && VIDEO.kt[seg]) || {};
  if (!seg || cfg.hide) { kt.style.opacity = 0; return; }
  if (kt.dataset.seg !== seg) {
    kt.dataset.seg = seg;
    kt.innerHTML = WSEG[seg].map(w => `<span class="${w.hl}">${w.w.replace('¶', '')}</span>` + (w.w.endsWith('¶') ? '<br>' : '')).join(' ');
    kt.style.top = (cfg.top || 320) + 'px';
    kt.style.fontSize = (cfg.size || 44) + 'px';
  }
  const s = S[seg];
  kt.style.opacity = 1 - clamp((t - (s.end + .25)) / .25);
  const sp = kt.querySelectorAll('span');
  WSEG[seg].forEach((w, i) => { const p = ease((t - w.t0 + .06) / .2); sp[i].style.opacity = p; sp[i].style.transform = `translateY(${(1 - p) * 10}px)`; sp[i].style.filter = `blur(${(1 - p) * 6}px)`; });
}
function cursorAt(t, path) {
  const c = $('cursor'), r = $('ripple');
  if (!path) { c.style.opacity = 0; r.style.opacity = 0; return; }
  const { t0, t1, from, to, click } = path;
  const p = inout((t - t0) / (t1 - t0));
  c.style.opacity = clamp((t - t0) / .2) * (path.hold ? 1 : 1 - clamp((t - click - .5) / .3));
  c.style.transform = `translate(${lerp(from[0], to[0], p)}px,${lerp(from[1], to[1], p)}px) scale(${t > click && t < click + .15 ? .85 : 1})`;
  const rp = clamp((t - click) / .5);
  r.style.opacity = t > click ? (1 - rp) : 0;
  r.style.left = (to[0] - 39) + 'px'; r.style.top = (to[1] - 39) + 'px';
  r.style.transform = `scale(${.4 + rp})`;
}

let VIDEO = {};
/*VIDEO*/

// ——— moteur ———
function alpha(sc, t) { const fin = sc.from <= 0 ? 1 : clamp((t - sc.from) / .14); return fin * (1 - clamp((t - sc.to) / .14)); }
function render(t) {
  const bg = VIDEO.bg ? VIDEO.bg(t) : null;
  const dop = dash(t, bg);
  $('grid').style.opacity = 1 - dop * .7;
  $('grid').style.transform = `translateY(${(t * 6) % 90}px)`;
  const au = VIDEO.aurora ? VIDEO.aurora(t) : null;
  $('aurora').style.opacity = au ? au.op : 0;
  $('aurora').style.top = (au ? au.top : 760) + 'px';
  $('aurora').style.transform = `translateX(${Math.sin(t * .25) * 60}px) scaleY(${1 + .08 * Math.sin(t * .4)})`;
  const red = VIDEO.red ? VIDEO.red(t) : 0;
  $('glowR').style.opacity = red;
  $('redvig').style.opacity = red * .9;
  $('glowG').style.opacity = (1 - red) * (VIDEO.glowG ? VIDEO.glowG(t) : .7);
  let ex = 0;
  for (const sc of VIDEO.scenes) {
    const a = alpha(sc, t);
    sc.el.style.opacity = a;
    sc.el.style.visibility = a > .001 ? 'visible' : 'hidden';
    if (a > 0) { sc.render(t); if (sc.ex) ex = Math.max(ex, a); }
  }
  let f = 0, fc = '#ffffff';
  (VIDEO.flashes || []).forEach(([t0, a, d, c]) => { if (t >= t0 && t < t0 + d) { const v = a * (1 - (t - t0) / d); if (v > f) { f = v; fc = c || '#ffffff'; } } });
  $('flash').style.opacity = f;
  $('flash').style.background = fc;
  $('tag').style.opacity = ex;
  let cp = null;
  for (const c of VIDEO.clicks || []) {
    if (t >= c.click - 1.1 && (c.hold || t < c.click + .8)) cp = { t0: c.click - 1.0, t1: c.click - .1, from: c.from || [180, 1600], to: c.to, click: c.click, hold: c.hold };
  }
  cursorAt(t, cp);
  kinetic(t);
}
// bruitages et musique, lus par build_audio.py
function events() { return { sfx: VIDEO.sfx || [], music: VIDEO.music, total: TL.total }; }
render(0);
